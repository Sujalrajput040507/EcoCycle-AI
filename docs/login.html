<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login & Registration — EcoCycle AI</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="navbar-inner">
        <a class="brand" href="./index.html">
          <span class="brand-icon">♻</span> EcoCycle AI
        </a>
        <div class="nav-links" id="nav-links">
          <a href="./index.html">Home</a>
        </div>
      </div>
    </nav>

    <main class="container">
      <div class="auth-container">
        <div class="card">
          <!-- Auth Mode Tabs -->
          <div class="auth-tabs" style="display:flex;margin-bottom:20px;border-bottom:1px solid var(--border)">
            <button id="tab-login" class="btn btn-ghost" style="flex:1;border-bottom:2px solid var(--green-700);border-radius:0;font-weight:700">
              Sign In
            </button>
            <button id="tab-register" class="btn btn-ghost" style="flex:1;border-bottom:2px solid transparent;border-radius:0;color:var(--text-secondary)">
              Register
            </button>
          </div>

          <h1 id="auth-heading" style="text-align:center;font-size:1.4rem;margin-bottom:4px">Welcome back</h1>
          <p id="auth-subheading" class="subtitle" style="text-align:center;margin-bottom:20px">Sign in to your account</p>

          <div id="login-error" class="alert alert-error" role="alert"></div>
          <div id="login-success" class="alert alert-success" role="alert"></div>

          <!-- Sign In Form -->
          <form id="login-form" novalidate>
            <div class="form-group">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" placeholder="name@example.com" required autocomplete="username" />
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <input id="password" name="password" type="password" placeholder="Enter password" required autocomplete="current-password" />
            </div>
            <button type="submit" class="btn btn-primary btn-lg" style="width:100%;margin-top:8px">
              Sign In
            </button>
          </form>

          <!-- Register Form -->
          <form id="register-form" novalidate style="display:none">
            <div class="form-group">
              <label for="reg-fullname">Full Name / Organization</label>
              <input id="reg-fullname" name="fullName" type="text" placeholder="e.g. Maya Sharma or GreenCycle Corp" required />
            </div>
            <div class="form-group">
              <label for="reg-email">Email Address</label>
              <input id="reg-email" name="email" type="email" placeholder="name@example.com" required autocomplete="email" />
            </div>
            <div class="form-group">
              <label for="reg-password">Password</label>
              <input id="reg-password" name="password" type="password" placeholder="Minimum 6 characters" required autocomplete="new-password" />
              <small style="color:var(--text-secondary);font-size:0.75rem">Must be at least 6 characters long.</small>
            </div>
            <div class="form-group">
              <label for="reg-role">I am a...</label>
              <select id="reg-role" name="role" required>
                <option value="generator">Industrial Waste Generator (PET Plastic Bottling/Manufacturing)</option>
                <option value="recycler">Plastic Recycler / Material Recovery Facility</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary btn-lg" style="width:100%;margin-top:8px">
              Create Account
            </button>
          </form>

          <!-- Demo Credentials Helper Box -->
          <div id="demo-credentials-box" class="credentials-box" style="margin-top:24px">
            <h4 style="margin-bottom:8px">Demo Credentials (1-Click Fill)</h4>
            <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px">
              <button type="button" class="btn btn-sm btn-outline demo-fill-btn" data-email="user@demo.com" data-pass="demo123">
                👤 Generator
              </button>
              <button type="button" class="btn btn-sm btn-outline demo-fill-btn" data-email="recycler@demo.com" data-pass="demo123">
                ♻ Recycler
              </button>
              <button type="button" class="btn btn-sm btn-outline demo-fill-btn" data-email="admin@demo.com" data-pass="admin456">
                🛡 Admin
              </button>
            </div>
            <p style="font-size:0.78rem;color:var(--text-secondary)">
              Demo accounts use pre-configured in-memory authentication for hackathon evaluation.
            </p>
          </div>
        </div>
      </div>
    </main>

    <footer>
      EcoCycle AI — GRAVITON 2026 Hackathon Project.
    </footer>
    <script src="./js/app.js"></script>
    <script src="./js/login.js"></script>
  </body>
</html>
